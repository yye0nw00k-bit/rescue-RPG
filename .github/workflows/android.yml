name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'pc/chunsang_raising.py'
      - 'pc/taehyun_rescue_pygame.py'
      - 'pc/requirements-pygame.txt'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Pygame source syntax and screens
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pygame>=2.6.1,<3.0'
          python -m py_compile android/main.py android/game_core.py pc/chunsang_raising.py pc/taehyun_rescue_pygame.py
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python - <<'PY'
          import sys
          sys.path.insert(0, "android")
          from game_core import ChunsangGame
          app = ChunsangGame()
          app.draw_login()
          app.view = "game"
          app.buttons = []
          app.draw_game()
          app.data["game_clear"] = True
          app.buttons = []
          app.draw_victory()
          app.view = "admin"
          app.buttons = []
          app.draw_admin()
          app.close()
          print("Pygame login, game, victory, and admin screens passed")
          PY

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk build-essential \
            autoconf automake libtool pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer 'cython>=3.1,<4'

      - name: Build APK
        working-directory: android
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunsang-raising-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
