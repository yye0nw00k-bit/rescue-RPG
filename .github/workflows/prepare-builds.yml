name: Prepare PC and Android builds

on:
  workflow_dispatch:
  push:
    paths:
      - "source_bundle/part-*.txt"
      - ".github/workflows/prepare-builds.yml"

permissions:
  contents: write

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project source files
        shell: bash
        run: |
          set -euo pipefail
          cat source_bundle/part-*.txt | base64 -d > /tmp/rescue-rpg.zip
          unzip -tq /tmp/rescue-rpg.zip
          mkdir -p /tmp/rescue-rpg
          unzip -oq /tmp/rescue-rpg.zip -d /tmp/rescue-rpg
          cp -a /tmp/rescue-rpg/. .
          rm -rf source_bundle
          rm -f .github/workflows/prepare-builds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PC and Android versions of Rescue RPG"
          git push

      - name: Set up Python for Android
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk build-essential \
            autoconf automake libtool pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Build Android APK
        working-directory: android
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taehyun-rescue-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
