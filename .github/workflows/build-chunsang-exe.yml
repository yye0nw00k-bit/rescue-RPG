name: Build Chunsang Kiwoogi EXE

on:
  push:
    branches: [main]
    paths:
      - "pc/chunsang_kiwoogi.py"
      - "pc/EXE_사용법.txt"
      - ".github/workflows/build-chunsang-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile pc/chunsang_kiwoogi.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name "천상 키우기" pc/chunsang_kiwoogi.py

      - name: Include usage guide
        shell: pwsh
        run: Copy-Item -LiteralPath "pc/EXE_사용법.txt" -Destination "dist/사용법.txt"

      - name: Prepare English-named EXE copy
        shell: pwsh
        run: Copy-Item -LiteralPath "dist/천상 키우기.exe" -Destination "dist/ChunsangKiwoogi.exe" -Force

      - name: Package downloadable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/천상 키우기.exe", "dist/사용법.txt" -DestinationPath "dist/ChunsangKiwoogi-Windows.zip" -Force

      - name: Publish public download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chunsang-kiwoogi-v1
          target_commitish: main
          name: 천상 키우기 Windows
          body: |
            천상 키우기 Windows 실행 파일입니다.
            ZIP 파일을 내려받아 압축을 풀고 천상 키우기.exe를 실행하세요.
          files: |
            dist/ChunsangKiwoogi-Windows.zip
            dist/ChunsangKiwoogi.exe
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunsang-kiwoogi-windows
          path: |
            dist/ChunsangKiwoogi-Windows.zip
            dist/ChunsangKiwoogi.exe
            dist/사용법.txt
          if-no-files-found: error
          retention-days: 30
